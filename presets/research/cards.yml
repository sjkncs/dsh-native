# 情境入口卡片 —— dsh-research-agent 面板从这里读卡。
# 改这个文件即可增删卡片（保存后刷新浏览器生效），无需重新构建插件。
# 每张卡四个字段：key（唯一标识）、title（卡名）、hint（小字）、template（点击后预填进输入框的开场模板）。

- key: topic
  title: 选题立项
  hint: 方向 · 可行性 · 创新点
  template: 我关注的研究方向是「……」，手头条件是……，帮我评估几个候选选题的可行性、创新点和工作量。

- key: literature
  title: 文献综述
  hint: 检索 · 梳理 · 找缺口
  template: 围绕「……」帮我梳理研究现状：主流方法有哪些、各自的局限、目前还有哪些没解决的缺口。

- key: experiment
  title: 实验设计
  hint: 数据 · 基线 · 消融
  template: 我想验证「……」这个想法，帮我设计实验方案：数据集怎么选、基线选谁、评价指标和消融怎么安排。

- key: writing
  title: 论文写作
  hint: 大纲 · 成稿 · 图表
  template: 帮我规划一篇关于「……」的论文：先出证据大纲，我确认后再逐节展开，图表怎么配也一并想好。

- key: review
  title: 审稿回复
  hint: 意见 · 回应 · 修改
  template: 审稿人提了这些意见：……，帮我逐条拆解他们的真实关切，起草点对点回复和修改方案。

- key: submission
  title: 投稿策略
  hint: 选刊 · cover letter · 时机
  template: 这篇工作的内容是……，想投稿但拿不准去哪，帮我对比合适的期刊/会议，再准备投稿材料。
