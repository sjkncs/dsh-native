# 科研工作台模块清单（与工作台抽屉内置配置同形的四字段回退源）。
# 工作台抽屉当前直接消费插件内置的模块定义；此文件由服务端路由对外提供，
# 供后续把模块定义 YAML 化时直接接线。

- key: ideas
  title: 想法素材库
  hint: 随手记 · 选题 · 开题
  template: 我记了一个科研想法：……，帮我判断值不值得做，能不能整理成选题或开题草稿。

- key: reading
  title: 文献研读
  hint: 笔记 · 心得 · 结合课题
  template: 帮我消化这篇文献：题目是「……」，来源是……，读完给我一份笔记要点和与我课题「……」的结合点。

- key: experiment-log
  title: 实验记录
  hint: 设置 · 结果 · 异常
  template: 帮我整理这次实验的记录：实验是……，设置是……，结果是……，异常是……，输出结构化实验报告。

- key: draft
  title: 论文草稿
  hint: 提纲 · 章节 · 图表
  template: 我的论文题目是「……」，现在写到……部分，要点是……，帮我把这一节起草出来。

- key: submission
  title: 投稿与答辩
  hint: 选刊 · cover letter · 逐条回复
  template: 目标投稿「……」，截止日期……，帮我准备投稿材料清单和 cover letter 草稿。
