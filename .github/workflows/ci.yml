name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Run preset / plugin / site / policy tests
        run: node --test "tests/*.test.mjs"

      - name: Syntax-check entry scripts
        run: |
          node --check desktop/main.js
          node --check scripts/setup.mjs
          node --check site/assets/js/app.js
          node --check packages/dsh-research-agent/build.mjs
          node --check packages/dsh-worktable/build.mjs
          node --check packages/dsh-reminder/build.mjs
